spring.application.name=homepick

# Thymeleaf 캐시 끄기 (저장 후 F5 새로고침 시 즉시 반영)
spring.thymeleaf.cache=false

# 정적 리소스(CSS, JS) 캐시 끄기
spring.web.resources.cache.period=0

# DevTools 재시작 및 LiveReload
spring.devtools.restart.enabled=true
# LiveReload 서버 활성화
spring.devtools.livereload.enabled=true

server.port=8080

# TiDB / MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Firebase Web Config (register.html -> window.__FIREBASE_CONFIG__ 주입)
firebase.web.api-key=${FIREBASE_WEB_API_KEY:}
firebase.web.auth-domain=${FIREBASE_WEB_AUTH_DOMAIN:}
firebase.web.project-id=${FIREBASE_WEB_PROJECT_ID:}
firebase.web.storage-bucket=${FIREBASE_WEB_STORAGE_BUCKET:}
firebase.web.messaging-sender-id=${FIREBASE_WEB_MESSAGING_SENDER_ID:}
firebase.web.app-id=${FIREBASE_WEB_APP_ID:}