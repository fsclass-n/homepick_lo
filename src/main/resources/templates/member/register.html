<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 홈픽(Homepick)</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Pretendard Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <!-- 커스텀 헤더 CSS -->
    <link rel="stylesheet" href="../static/css/common.css" th:href="@{/css/common.css}">
    <!-- Custom Join CSS -->
    <link rel="stylesheet" href="../../static/css/register.css" th:href="@{/css/register.css}">
</head>

<body class="bg-white">

    <div class="register-wrapper d-flex flex-column justify-content-between min-vh-100">

        <!-- 중앙 메인 영역 -->
        <main class="register-container container d-flex flex-column align-items-center justify-content-center my-auto py-5">

            <!-- 1. 로고 -->
            <div class="text-center mb-4">
                <a href="/" class="text-decoration-none d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-house-door-fill fs-2 text-brand"></i>
                    <span class="fs-3 fw-bold text-dark tracking-tight">HOMEPICK</span>
                </a>
                <p class="text-secondary small mt-1 mb-0">우리 집 찾기의 모든 것, 홈픽 회원가입</p>
            </div>

            <!-- 2. 회원가입 폼 박스 -->
            <div class="w-100 px-3">

                <!-- STEP 1: 부동산 서비스 이용약관 동의 -->
                <section id="step1" class="step-section">
                    <h2 class="fs-5 fw-bold text-dark mb-3 text-center">홈픽 서비스 이용을 위한<br>약관 동의가 필요해요</h2>

                    <div class="check-all-box mb-3 p-3 rounded-3 d-flex align-items-start border">
                        <input class="form-check-input custom-checkbox mt-1 me-2" type="checkbox" id="checkAll">
                        <label class="form-check-label fw-bold text-dark user-select-none" for="checkAll">
                            전체 약관에 동의합니다
                            <span class="d-block fw-normal text-secondary small mt-1">
                                매물 정보 알림, 허위매물 신고 규정, 위치기반 매물 탐색 서비스(선택) 동의가 포함됩니다.
                            </span>
                        </label>
                    </div>

                    <ul class="list-unstyled terms-list mb-4 px-1">
                        <li class="d-flex justify-content-between align-items-center py-2 border-bottom">
                            <div class="form-check mb-0 d-flex align-items-center gap-2">
                                <input class="form-check-input custom-checkbox term-item" type="checkbox" id="termService" required>
                                <label class="form-check-label small text-dark user-select-none" for="termService">[필수] 홈픽 이용약관</label>
                            </div>
                            <a href="javascript:void(0)" class="text-secondary small text-decoration-underline">내용보기</a>
                        </li>
                        <li class="d-flex justify-content-between align-items-center py-2 border-bottom">
                            <div class="form-check mb-0 d-flex align-items-center gap-2">
                                <input class="form-check-input custom-checkbox term-item" type="checkbox" id="termPrivacy" required>
                                <label class="form-check-label small text-dark user-select-none" for="termPrivacy">[필수] 개인정보 수집 및 이용 동의</label>
                            </div>
                            <a href="javascript:void(0)" class="text-secondary small text-decoration-underline">내용보기</a>
                        </li>
                        <li class="d-flex justify-content-between align-items-center py-2 border-bottom">
                            <div class="form-check mb-0 d-flex align-items-center gap-2">
                                <input class="form-check-input custom-checkbox term-item" type="checkbox" id="termLocation">
                                <label class="form-check-label small text-dark user-select-none" for="termLocation">[선택] 위치기반 부동산 매물 추천 서비스</label>
                            </div>
                            <a href="javascript:void(0)" class="text-secondary small text-decoration-underline">내용보기</a>
                        </li>
                        <li class="d-flex justify-content-between align-items-center py-2">
                            <div class="form-check mb-0 d-flex align-items-center gap-2">
                                <input class="form-check-input custom-checkbox term-item" type="checkbox" id="termMarketing">
                                <label class="form-check-label small text-secondary user-select-none" for="termMarketing">[선택] 맞춤 청약 및 분양 혜택 정보 수신</label>
                            </div>
                        </li>
                    </ul>

                    <button type="button" class="btn btn-action w-100 fw-bold mb-4" id="btnStep1" disabled>다음</button>
                </section>

                <!-- STEP 2: 기본 회원 정보 (이름, 생년월일, 성별) -->
                <section id="step2" class="step-section d-none">
                    <h2 class="fs-5 fw-bold text-dark mb-4 text-center">회원님의 기본 정보를<br>입력해 주세요</h2>

                    <div class="mb-3">
                        <label for="userName" class="form-label small fw-semibold text-secondary">이름</label>
                        <input type="text" class="form-control form-control-lg custom-input" id="userName" placeholder="실명을 입력해 주세요">
                    </div>

                    <div class="mb-3">
                        <label for="userBirth" class="form-label small fw-semibold text-secondary">생년월일 (8자리)</label>
                        <input type="text" class="form-control form-control-lg custom-input" id="userBirth" placeholder="예: 19950315" maxlength="8">
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">성별</label>
                        <div class="d-flex gap-2">
                            <input type="radio" class="btn-check" name="userGender" id="genderM" value="M" autocomplete="off">
                            <label class="btn btn-outline-gender w-50 py-2 fw-semibold" for="genderM">남성</label>

                            <input type="radio" class="btn-check" name="userGender" id="genderF" value="F" autocomplete="off">
                            <label class="btn btn-outline-gender w-50 py-2 fw-semibold" for="genderF">여성</label>
                        </div>
                    </div>

                    <button type="button" class="btn btn-action w-100 fw-bold mb-4" id="btnStep2" disabled>다음</button>
                </section>

                <!-- STEP 3: 휴대폰 본인인증 -->
                <section id="step3" class="step-section d-none">
                    <h2 class="fs-5 fw-bold text-dark mb-2 text-center">휴대전화번호를 인증해 주세요</h2>
                    <p class="text-secondary small text-center mb-4">안전한 거래를 위해 본인인증을 진행합니다.</p>

                    <div class="mb-3">
                        <label for="userPhone" class="form-label small fw-semibold text-secondary">휴대폰 번호</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 fw-bold text-secondary">+82</span>
                            <input type="tel" class="form-control form-control-lg custom-input border-start-0 ps-1" id="userPhone" placeholder="01012345678" maxlength="11">
                        </div>
                    </div>

                    <!-- Firebase reCAPTCHA Invisible Container -->
                    <div id="recaptcha-container"></div>

                    <button type="button" class="btn btn-action w-100 fw-bold mb-4 mt-2" id="btnSendAuthCode" disabled>
                        인증문자 받기
                    </button>
                </section>

                <!-- STEP 4: 계정 생성 (아이디 & 비밀번호) -->
                <section id="step4" class="step-section d-none">
                    <h2 class="fs-5 fw-bold text-dark mb-4 text-center">로그인에 사용할<br>아이디와 비밀번호를 정해주세요</h2>

                    <form id="joinForm" onsubmit="return false;">
                        <div class="mb-3">
                            <label for="userId" class="form-label small fw-semibold text-secondary">아이디</label>
                            <input type="text" class="form-control form-control-lg custom-input" id="userId" placeholder="4~20자 영문, 숫자, _ (예: homepick123)"
                                minlength="4" maxlength="20" autocomplete="username" spellcheck="false" autocapitalize="none">
                            <div id="userIdFeedback" class="invalid-feedback ps-1 small text-start"></div>
                        </div>

                        <div class="mb-3">
                            <label for="userPassword" class="form-label small fw-semibold text-secondary">비밀번호</label>
                            <input type="password" class="form-control form-control-lg custom-input" id="userPassword" placeholder="8~30자 영문+숫자 필수 (특수문자 @$!%*#?& 허용)"
                                minlength="8" maxlength="30" autocomplete="new-password">
                            <div id="userPasswordFeedback" class="invalid-feedback ps-1 small text-start"></div>
                        </div>

                        <div class="mb-4">
                            <label for="userPasswordConfirm" class="form-label small fw-semibold text-secondary">비밀번호 확인</label>
                            <input type="password" class="form-control form-control-lg custom-input" id="userPasswordConfirm" placeholder="비밀번호 재입력"
                                maxlength="30" autocomplete="new-password">
                            <div id="userPasswordConfirmFeedback" class="invalid-feedback ps-1 small text-start"></div>
                        </div>

                        <button type="button" class="btn btn-action w-100 fw-bold mb-4" id="btnSubmitJoin" disabled>
                            홈픽 시작하기
                        </button>
                    </form>
                </section>

                <!-- 로그인 이동 링크 -->
                <div class="text-center">
                    <span class="text-secondary small">이미 홈픽 계정이 있으신가요?</span>
                    <a href="/member/login" class="text-brand small text-decoration-none fw-bold ms-1">로그인</a>
                </div>

            </div>
        </main>

        <!-- 4. 푸터 -->
        <footer class="text-center py-4 border-top bg-light">
            <span class="small text-secondary fw-light">© HOMEPICK CORP. ALL RIGHTS RESERVED.</span>
        </footer>

    </div>

    <!-- Firebase 인증번호 입력 Modal -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 p-3 rounded-3 shadow">
                <div class="modal-header border-0 pb-0">
                    <div>
                        <span class="badge bg-light text-dark border fw-normal" id="modalTargetPhone"></span>
                        <h5 class="modal-title fs-6 fw-bold mt-2">인증번호 입력</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="btnCloseModal"></button>
                </div>
                <div class="modal-body text-center">
                    <p class="small text-secondary mb-3">전송된 6자리 번호를 입력해 주세요.</p>

                    <div class="d-flex justify-content-between mb-3 gap-1">
                        <input type="text" maxlength="1" class="form-control text-center fs-5 otp-input custom-input px-0" inputmode="numeric">
                        <input type="text" maxlength="1" class="form-control text-center fs-5 otp-input custom-input px-0" inputmode="numeric">
                        <input type="text" maxlength="1" class="form-control text-center fs-5 otp-input custom-input px-0" inputmode="numeric">
                        <input type="text" maxlength="1" class="form-control text-center fs-5 otp-input custom-input px-0" inputmode="numeric">
                        <input type="text" maxlength="1" class="form-control text-center fs-5 otp-input custom-input px-0" inputmode="numeric">
                        <input type="text" maxlength="1" class="form-control text-center fs-5 otp-input custom-input px-0" inputmode="numeric">
                    </div>

                    <div class="d-flex justify-content-between small text-secondary mb-3">
                        <span>남은 시간 <strong class="text-danger" id="timer">03:00</strong></span>
                        <a href="javascript:void(0)" class="text-secondary text-decoration-none" id="btnResendAuth">재전송</a>
                    </div>

                    <button type="button" class="btn btn-action w-100 fw-bold py-2" id="btnVerifyAuthCode">확인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <!-- Firebase Config (gitignore 대상, 로컬에서 직접 생성) -->
    <script th:src="@{/js/firebase-config.js}" src="../../static/js/firebase-config.js"></script>

    <!-- Custom Join JS -->
    <script th:src="@{/js/register.js}" src="../../static/js/register.js"></script>
</body>

</html>
