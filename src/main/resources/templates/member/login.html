<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 홈픽(Homepick)</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Pretendard Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <!-- 커스텀 헤더 CSS -->
    <link rel="stylesheet" href="../static/css/common.css" th:href="@{/css/common.css}">
    <!-- CSS 연결 -->
    <link rel="stylesheet" href="../../static/css/login.css" th:href="@{/css/login.css}">
</head>

<body class="bg-white">

    <div class="login-wrapper d-flex flex-column justify-content-between min-vh-100">

        <!-- 중앙 메인 영역 (인라인 스타일 제거 -> .login-container 클래스로 이관) -->
        <main
            class="login-container container d-flex flex-column align-items-center justify-content-center my-auto py-5">

            <!-- 1. 로고 -->
            <div class="text-center mb-4">
                <a href="/" class="text-decoration-none d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-house-door-fill fs-2 text-brand"></i>
                    <span class="fs-3 fw-bold text-dark tracking-tight">HOMEPICK</span>
                </a>
            </div>

            <!-- 2. 로그인 폼 박스 -->
            <div class="w-100 px-3">
                <form action="/member/login" method="post" id="loginForm" novalidate>

                    <!-- 전역 에러 메시지 알림 박스 -->
                    <div id="loginAlert" class="alert alert-danger py-2 px-3 small mb-3 rounded-2 text-center"
                        th:classappend="${error == null} ? 'd-none'" th:text="${error}" role="alert">
                        아이디 또는 비밀번호가 일치하지 않습니다.
                    </div>

                    <!-- 아이디 입력 그룹 (접근성 라벨 추가) -->
                    <div class="mb-2">
                        <label for="username" class="visually-hidden">아이디</label>
                        <input type="text" id="username" name="username"
                            class="form-control form-control-lg custom-input" placeholder="아이디" required minlength="4"
                            maxlength="20" pattern="^[a-zA-Z0-9_]{4,20}$" th:value="${username}" autocomplete="username" spellcheck="false"
                            autocapitalize="none">
                        <div id="usernameFeedback" class="invalid-feedback ps-1 small text-start"></div>
                    </div>

                    <!-- 비밀번호 입력 그룹 (접근성 라벨 추가 및 구조 정렬) -->
                    <div class="mb-3">
                        <div class="position-relative">
                            <label for="password" class="visually-hidden">비밀번호</label>
                            <input type="password" id="password" name="password"
                                class="form-control form-control-lg custom-input pe-5" placeholder="비밀번호" required
                                minlength="8" maxlength="30" autocomplete="current-password">
                            <button type="button"
                                class="btn-toggle-pw position-absolute end-0 top-50 translate-middle-y me-3 border-0 bg-transparent text-secondary p-0"
                                id="togglePassword" aria-label="비밀번호 표시 전환">
                                <i class="bi bi-eye-slash fs-5" id="eyeIcon"></i>
                            </button>
                            <div id="passwordFeedback" class="invalid-feedback ps-1 small text-start"></div>
                        </div>
                    </div>

                    <!-- 아이디 저장 -->
                    <div class="form-check mb-4 d-flex align-items-center gap-2">
                        <input class="form-check-input custom-checkbox" type="checkbox" id="rememberMe"
                            name="remember-me">
                        <label class="form-check-label small text-secondary user-select-none" for="rememberMe">
                            아이디 저장
                        </label>
                    </div>

                    <!-- 로그인 버튼 -->
                    <button type="submit" class="btn btn-login w-100 fw-bold mb-4" id="btnLogin" disabled>
                        로그인
                    </button>
                </form>

                <!-- 서브 유틸 링크 -->
                <div class="d-flex justify-content-center align-items-center gap-3 small mb-4">
                    <a href="/member/register" class="link-dark fw-bold text-decoration-none">회원가입</a>
                    <span class="text-black-50 small">|</span>
                    <a href="/member/find-id" class="link-secondary text-decoration-none">아이디 찾기</a>
                    <span class="text-black-50 small">|</span>
                    <a href="/member/find-pw" class="link-secondary text-decoration-none">비밀번호 찾기</a>
                </div>

                <!-- 3. SNS 로그인 버튼 영역 -->
                <div class="d-flex flex-column gap-2 mb-4">
                    <a href="#none"
                        class="btn btn-social btn-kakao position-relative w-100 fw-semibold text-decoration-none">
                        <i class="bi bi-chat-fill position-absolute start-0 top-50 translate-middle-y ms-3 fs-5"></i>
                        <span>카카오 로그인</span>
                    </a>

                    <a href="#none"
                        class="btn btn-social btn-naver position-relative w-100 fw-semibold text-decoration-none">
                        <span class="naver-icon position-absolute start-0 top-50 translate-middle-y ms-3">N</span>
                        <span>네이버 로그인</span>
                    </a>

                    <a href="#none"
                        class="btn btn-social btn-google position-relative w-100 fw-semibold text-decoration-none border">
                        <svg class="position-absolute start-0 top-50 translate-middle-y ms-3" width="20" height="20"
                            viewBox="0 0 24 24">
                            <path fill="#4285F4"
                                d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" />
                            <path fill="#34A853"
                                d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z" />
                            <path fill="#FBBC05"
                                d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z" />
                            <path fill="#EA4335"
                                d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" />
                        </svg>
                        <span>구글 로그인</span>
                    </a>
                </div>

                <!-- 비회원 조회 링크 -->
                <div class="text-center">
                    <a href="/guest/lookup" class="text-secondary small text-decoration-none">
                        비회원 매물/신청 조회 <i class="bi bi-chevron-right small"></i>
                    </a>
                </div>

            </div>
        </main>

        <!-- 4. 푸터 -->
        <footer class="text-center py-4 border-top bg-light">
            <span class="small text-secondary fw-light">© HOMEPICK CORP. ALL RIGHTS RESERVED.</span>
        </footer>

    </div>

    <!-- Bootstrap 5 JS & Script 연결 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/login.js}" src="../../static/js/login.js"></script>
</body>

</html>
