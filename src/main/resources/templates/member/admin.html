<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈픽 - 등록 회원 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 750px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0">👥 가입 회원 목록</h4>
            <div>
                <a href="/" th:href="@{/}" class="btn btn-sm btn-outline-secondary">홈으로</a>
                <a href="register.html" th:href="@{/member/register}" class="btn btn-sm btn-primary">신규 가입</a>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" class="text-center" style="width: 10%;">No</th>
                            <th scope="col" style="width: 25%;">이름</th>
                            <th scope="col" style="width: 35%;">이메일</th>
                            <th scope="col" style="width: 30%;">비밀번호</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 회원이 있을 경우 -->
                        <tr th:each="member, iterStat : ${members}">
                            <td class="text-center text-muted small" th:text="${iterStat.count}">1</td>
                            <td class="fw-semibold" th:text="${member.name}">이름</td>
                            <td class="text-muted" th:text="${member.email}">이메일</td>
                            <td class="text-danger font-monospace small" th:text="${member.password}">비밀번호</td>
                        </tr>

                        <!-- 회원이 없을 경우 -->
                        <tr th:if="${#lists.isEmpty(members)}">
                            <td colspan="4" class="text-center py-4 text-muted">
                                등록된 회원이 없습니다.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
