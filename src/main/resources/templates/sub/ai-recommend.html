<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 맞춤 매물 추천 - 홈픽(Homepick)</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 공통 / 헤더 / 푸터 CSS -->
    <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="../../static/css/header.css" th:href="@{/css/header.css}">
    <link rel="stylesheet" href="../../static/css/footer.css" th:href="@{/css/footer.css}">
    <!-- AI 추천 페이지 CSS -->
    <link rel="stylesheet" href="../../static/css/ai-recommend.css" th:href="@{/css/ai-recommend.css}">
</head>

<body class="ai-page">

    <!-- 헤더 -->
    <div th:replace="~{common/header :: headerFragment}"></div>

    <!-- 1. 상단 히어로 -->
    <section class="ai-hero position-relative text-white text-center overflow-hidden">
        <div class="ai-hero-glow position-absolute top-0 start-0 w-100 h-100"></div>
        <div class="container position-relative py-5">
            <i class="bi bi-stars ai-hero-icon d-inline-block mb-2" aria-hidden="true"></i>
            <h1 class="ai-hero-title fw-bold mb-2">AI 맞춤 매물 추천</h1>
            <p class="ai-hero-desc mb-0">원하는 조건을 입력하면 AI가 최적의 매물을 추천해드립니다.</p>
        </div>
    </section>

    <!-- 2. 조건 입력 카드 -->
    <main class="ai-main pb-5">
        <div class="container">
            <div class="ai-card bg-white rounded-4 p-4 p-md-5 mx-auto">

                <h2 class="ai-card-title d-flex align-items-center gap-2 fw-bold mb-4">
                    <span aria-hidden="true">🏠</span> 나의 조건 입력
                </h2>

                <form id="aiRecommendForm" novalidate>
                    <div class="d-flex flex-column flex-md-row gap-3 mb-4">
                        <!-- 최대 예산 -->
                        <div class="flex-fill">
                            <label for="budget" class="form-label ai-label">최대 예산 (만원)</label>
                            <input type="number" id="budget" name="budget" class="form-control ai-input"
                                value="1000" min="1" step="100" inputmode="numeric" required>
                            <div class="invalid-feedback">예산을 1만원 이상 입력해 주세요.</div>
                        </div>

                        <!-- 희망 방 수 -->
                        <div class="flex-fill">
                            <label for="rooms" class="form-label ai-label">희망 방 수</label>
                            <select id="rooms" name="rooms" class="form-select ai-input" required>
                                <option value="1" selected>1방</option>
                                <option value="2">2방</option>
                                <option value="3">3방</option>
                                <option value="4">4방 이상</option>
                            </select>
                        </div>

                        <!-- 희망 지역 -->
                        <div class="flex-fill">
                            <label for="region" class="form-label ai-label">희망 지역</label>
                            <input type="text" id="region" name="region" class="form-control ai-input"
                                value="서울" maxlength="30" required>
                            <div class="invalid-feedback">희망 지역을 입력해 주세요.</div>
                        </div>
                    </div>

                    <button type="submit" id="btnAiRecommend"
                        class="btn btn-ai w-100 fw-bold d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-magic" aria-hidden="true"></i>
                        <span class="btn-label">AI 추천 받기</span>
                    </button>
                </form>

                <!-- 학습 데이터 정보 + 최신 데이터 갱신 -->
                <div class="ai-data-bar d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 mt-4 pt-3">
                    <p class="ai-data-info d-flex align-items-center gap-2 mb-0">
                        <i class="bi bi-database-check" aria-hidden="true"></i>
                        <span id="aiDataInfo">학습 데이터를 확인하는 중...</span>
                    </p>
                    <button th:if="${user != null}" type="button" id="btnAiRefresh"
                        class="btn btn-ai-refresh flex-shrink-0 d-flex align-items-center justify-content-center gap-1">
                        <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
                        <span>최신 데이터로 AI 재학습</span>
                    </button>
                    <a th:unless="${user != null}" href="/member/login" th:href="@{/member/login}"
                        class="ai-login-hint flex-shrink-0">로그인하면 최신 데이터로 AI를 재학습할 수 있어요</a>
                </div>

                <!-- 크롤링·학습 진행 표시 -->
                <div id="aiRefreshPanel" class="ai-refresh-panel mt-3 p-3 rounded-3 d-none" aria-live="polite">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span class="spinner-border spinner-border-sm ai-refresh-spinner" role="status" aria-hidden="true"></span>
                        <i class="bi bi-check-circle-fill ai-refresh-done-icon d-none" aria-hidden="true"></i>
                        <i class="bi bi-exclamation-circle-fill ai-refresh-fail-icon d-none" aria-hidden="true"></i>
                        <strong id="aiRefreshTitle" class="ai-refresh-title">최신 실거래 데이터를 크롤링하는 중...</strong>
                        <span id="aiRefreshElapsed" class="ai-refresh-elapsed ms-auto"></span>
                    </div>
                    <div class="progress ai-refresh-progress mb-3" role="progressbar" aria-label="갱신 진행률">
                        <div id="aiRefreshBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 5%"></div>
                    </div>
                    <ol class="ai-refresh-steps list-unstyled d-flex flex-wrap gap-2 mb-2">
                        <li data-step="0">준비</li>
                        <li data-step="1">공공데이터 크롤링</li>
                        <li data-step="2">데이터 전처리</li>
                        <li data-step="3">머신러닝 학습</li>
                        <li data-step="4">서버 반영</li>
                    </ol>
                    <p id="aiRefreshNote" class="ai-refresh-note mb-0">
                        완료까지 약 5~8분 걸립니다. 페이지를 떠나도 계속 진행되며, 끝나기 전까지는 기존 데이터로 추천합니다.
                    </p>
                </div>
            </div>

            <!-- 3. 추천 결과 영역 -->
            <section id="aiResult" class="ai-result mx-auto mt-4 d-none" aria-live="polite"></section>
        </div>
    </main>

    <!-- footer -->
    <div th:replace="~{common/footer :: footerFragment}"></div>

    <!-- Bootstrap 5 JS & 공통 Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/header.js}"></script>
    <script th:src="@{/js/footer.js}"></script>
    <script th:src="@{/js/cursor.js}"></script>
    <!-- AI 추천 페이지 Script -->
    <script th:src="@{/js/ai-recommend.js}" src="../../static/js/ai-recommend.js"></script>
</body>

</html>
