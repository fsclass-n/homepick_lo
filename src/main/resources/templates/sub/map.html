<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지도 중심 실거래 조회 - 홈픽(Homepick)</title>
    <link rel="icon" href="/favicon.ico" th:href="@{/favicon.ico}" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" th:href="@{/favicon.svg}">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" th:href="@{/apple-touch-icon.png}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="../../static/css/header.css" th:href="@{/css/header.css}">
    <link rel="stylesheet" href="../../static/css/footer.css" th:href="@{/css/footer.css}">
    <link rel="stylesheet" href="../../static/css/map.css" th:href="@{/css/map.css}">
</head>

<body class="map-page">

    <div th:replace="~{common/header :: headerFragment}"></div>

    <!-- 1. 제목 바 -->
    <section class="map-titlebar">
        <div class="container-fluid map-container d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-2">
            <div>
                <h1 class="map-title fw-bold mb-1"><i class="bi bi-geo-alt-fill" aria-hidden="true"></i> 지도 중심 실거래 조회</h1>
                <p id="mapDataInfo" class="map-subtitle mb-0">실거래 데이터를 불러오는 중...</p>
            </div>
            <span class="map-badge d-inline-flex align-items-center gap-1">
                <i class="bi bi-info-circle" aria-hidden="true"></i>
                현재 판매 중인 매물이 아닌, 거래가 완료된 실거래 기록입니다
            </span>
        </div>
    </section>

    <!-- 2. 필터 + 목록 | 지도 -->
    <main class="map-layout">
        <aside class="map-side" aria-label="실거래 단지 검색">
            <form id="mapFilter" class="map-filter" autocomplete="off" onsubmit="return false;">
                <div class="row g-2">
                    <div class="col-6">
                        <label for="fSido" class="map-label">시·도</label>
                        <select id="fSido" class="form-select form-select-sm">
                            <option value="">수도권 전체</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label for="fSgg" class="map-label">시·군·구</label>
                        <select id="fSgg" class="form-select form-select-sm">
                            <option value="">전체</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label for="fBudget" class="map-label">최대 거래가 (만원)</label>
                        <input type="number" id="fBudget" class="form-control form-control-sm" min="0" step="1000"
                            placeholder="제한 없음" inputmode="numeric">
                    </div>
                    <div class="col-6">
                        <label for="fRooms" class="map-label">방 수 (면적 추정)</label>
                        <select id="fRooms" class="form-select form-select-sm">
                            <option value="">전체</option>
                            <option value="1">1방</option>
                            <option value="2">2방</option>
                            <option value="3">3방</option>
                            <option value="4">4방 이상</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="fName" class="map-label">단지명 · 동 검색</label>
                        <input type="search" id="fName" class="form-control form-control-sm" maxlength="30"
                            placeholder="예: 래미안, 압구정동">
                    </div>
                    <div class="col-12 d-flex align-items-center justify-content-between gap-2 flex-wrap">
                        <div class="form-check form-switch mb-0">
                            <input class="form-check-input" type="checkbox" role="switch" id="fValue">
                            <label class="form-check-label map-check" for="fValue">AI 저평가 단지만</label>
                        </div>
                        <select id="fSort" class="form-select form-select-sm w-auto" aria-label="정렬">
                            <option value="value">AI 저평가순</option>
                            <option value="priceAsc">거래가 낮은순</option>
                            <option value="priceDesc">거래가 높은순</option>
                            <option value="recent">최근 거래순</option>
                        </select>
                    </div>
                </div>
            </form>

            <div class="map-list-head d-flex align-items-center justify-content-between">
                <strong id="mapListCount" class="map-list-count">-</strong>
                <span class="map-legend d-flex align-items-center gap-2">
                    <span><i class="map-dot map-dot-value"></i>AI 저평가</span>
                    <span><i class="map-dot"></i>일반</span>
                </span>
            </div>
            <ul id="mapList" class="map-list list-unstyled mb-0" aria-live="polite"></ul>
        </aside>

        <section class="map-area">
            <div id="map" class="map-canvas" role="application" aria-label="실거래 단지 지도"></div>
            <div id="mapNotice" class="map-notice d-none"></div>
        </section>
    </main>

    <div class="map-disclaimer">
        <p class="container-fluid map-container mb-0">
            <i class="bi bi-shield-check" aria-hidden="true"></i>
            국토교통부 실거래 신고 자료(최근 6개월 거래 완료 기록)와 AI 분석 결과입니다. 단지 위치는 지번 주소로 찾은 좌표라 실제와 조금 다를 수 있으며, 현재 매물 호가와 다를 수 있습니다.
        </p>
    </div>

    <div th:replace="~{common/footer :: footerFragment}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/header.js}"></script>
    <script th:src="@{/js/footer.js}"></script>
    <!-- 카카오맵 SDK (키가 있을 때만, 마커 묶음 표시용 clusterer 라이브러리 포함) -->
    <script th:if="${!#strings.isEmpty(kakaoJsKey)}"
        th:src="@{https://dapi.kakao.com/v2/maps/sdk.js(appkey=${kakaoJsKey},libraries='clusterer',autoload='false')}"></script>
    <script th:src="@{/js/map.js}" src="../../static/js/map.js"></script>
</body>

</html>
