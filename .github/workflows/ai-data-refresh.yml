name: AI 추천 데이터 갱신

# 페이지의 '최신 데이터로 AI 재학습' 버튼 → Spring 이 GitHub API 로 실행
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ml-pipeline

    steps:
      - name: 저장소 준비
        uses: actions/checkout@v4

      - name: Python 환경 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: 'pip'
          cache-dependency-path: ml-pipeline/requirements.txt

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 공공데이터 크롤링
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          CRAWL_MONTHS: '6'
        run: python 01_crawl.py

      - name: 데이터 전처리
        run: python 02_preprocess.py

      - name: 머신러닝 학습
        run: python 04_train.py

      - name: 학습 결과 반영
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/static/data/apartments.json
          git commit -m "chore: AI 추천 데이터 갱신 (실거래가 크롤링·재학습)"
          git pull --rebase origin main
          git push origin HEAD:main
